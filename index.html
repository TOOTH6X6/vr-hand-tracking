<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VR + Hand Tracking v2</title>
<style>
:root{--bg:#0a0e1b;--fg:#e9eeff;--ac:#4fd8ff;--pn:rgba(10,14,27,.82)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Noto Sans Thai",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left))}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--pn);border:1px solid #33406b;border-radius:10px;padding:9px 12px}
button:active{background:#1c2748}
button.on{border-color:var(--ac);color:var(--ac)}
#rcw{display:flex;align-items:center;gap:6px;background:var(--pn);border:1px solid #33406b;border-radius:10px;padding:6px 10px;font-size:13px}
#rc{width:90px}
#st{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:5;font-size:13px;max-width:60%;background:var(--pn);padding:6px 10px;border-radius:8px}
.pv{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right));width:96px;height:72px;border:1px solid var(--ac);border-radius:8px;background:#000;z-index:4;display:none}
.pv.on{display:block}
#p2{display:none}
#x{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:none;padding:4px 10px;font-size:12px}
body.vr #ui,body.vr #st{display:none}
body.vr #x{display:block}
body.vr #p1{left:calc(25% - 48px);right:auto}
body.vr #p2.on{display:block;left:calc(75% - 48px)}
#ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:rgba(10,14,27,.96)}
#ov h1{margin:0;font-size:26px;font-weight:700;line-height:1.3}
#ov p{margin:0;max-width:34em;line-height:1.7;color:#aab6dd;font-size:15px}
#go{background:var(--ac);color:#04121a;font-weight:700;font-size:17px;border:0;padding:13px 34px}
#v{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="v" playsinline muted></video>
<canvas id="p1" class="pv" width="96" height="72"></canvas>
<canvas id="p2" class="pv" width="96" height="72"></canvas>
<div id="ui">
  <button id="bvr">โหมด VR (แยกจอ)</button>
  <button id="bq">คุณภาพ</button>
  <button id="brc">รีเซ็ตมุมมอง</button>
  <button id="brs">รีเซ็ตของ</button>
  <label id="rcw">ระยะเอื้อม <input id="rc" type="range" min="1" max="2.6" step=".1" value="1.7"></label>
</div>
<button id="x">ออกจาก VR</button>
<div id="st">พร้อมเริ่ม</div>
<div id="ov">
  <h1>VR + Hand Tracking v2</h1>
  <p>ใส่มือถือในแว่น Cardboard ให้กล้องหลังหันไปข้างหน้า ยื่นมือให้กล้องเห็น แล้วลองดังนี้</p>
  <p>จีบนิ้วโป้งกับนิ้วชี้เพื่อหยิบ (หมุนข้อมือเพื่อหมุนของ) · ใช้ฝ่ามือหรือปลายนิ้วปัดเพื่อผลัก · เหวี่ยงแล้วปล่อยเพื่อโยน · ของชนกันเองได้</p>
  <button id="go">เริ่ม</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const $ = s => document.querySelector(s), video = $('#v'), st = t => { $('#st').textContent = t; };
const Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
const T1 = new THREE.Vector3(), T2 = new THREE.Vector3(), T3 = new THREE.Vector3(), QQ = new THREE.Quaternion(), MM = new THREE.Matrix4();

/* ---------- renderer / scene (lightweight materials for speed) ---------- */
const QL = [0.75, 1, 1.5]; let qi = 1;
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: false, powerPreference: 'high-performance' });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1b);
scene.fog = new THREE.Fog(0x0a0e1b, 5, 14);
const camera = new THREE.PerspectiveCamera(70, 1, 0.02, 40);
camera.position.set(0, 1.45, 0.1); scene.add(camera);
const sc = new THREE.StereoCamera(); sc.eyeSep = 0.064; sc.aspect = 0.5;
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
function applyQ() { renderer.setPixelRatio(Math.min(devicePixelRatio, QL[qi])); resize(); $('#bq').textContent = 'คุณภาพ: ' + ['ต่ำ', 'กลาง', 'สูง'][qi]; }
addEventListener('resize', resize); applyQ();
$('#bq').onclick = () => { qi = (qi + 1) % 3; applyQ(); };

const M = (c, e = 0, ei = 0) => new THREE.MeshLambertMaterial({ color: c, emissive: e, emissiveIntensity: ei });
scene.add(new THREE.HemisphereLight(0xb4c8ff, 0x2a1a30, 1.05));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(2, 4, 2); scene.add(dl);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), M(0x111a30)); floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(40, 40, 0x4fd8ff, 0x1d2a50); grid.position.y = 0.002; scene.add(grid);
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2, r = 4 + (i % 3) * 0.8, h = 1.5 + (i * 37 % 10) / 3, col = new THREE.Color().setHSL((i * 0.13) % 1, 0.7, 0.55);
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.35, h, 0.35), M(0x1b2442, col, 0.45)); p.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r); scene.add(p);
}
const TB = { x: 0, z: -0.5, w: 0.9, d: 0.5, y: 1.0 }, tm = M(0x2b3860);
const top = new THREE.Mesh(new THREE.BoxGeometry(TB.w, 0.04, TB.d), tm); top.position.set(TB.x, TB.y - 0.02, TB.z); scene.add(top);
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => {
  const l = new THREE.Mesh(new THREE.BoxGeometry(0.04, TB.y, 0.04), tm); l.position.set(TB.x + a * (TB.w / 2 - 0.04), TB.y / 2, TB.z + b * (TB.d / 2 - 0.04)); scene.add(l);
});

/* ---------- objects: cubes + balls, sphere-based collisions ---------- */
const R = 0.045, S = R * 2;
const boxG = new THREE.BoxGeometry(S, S, S), sphG = new THREE.SphereGeometry(R, 16, 12), edgeG = new THREE.EdgesGeometry(boxG);
const cols = [0xff5470, 0xffb347, 0xffe14d, 0x5ef08a, 0x4fd8ff, 0xb98cff, 0xff8fd8, 0x9bf0ff, 0xf0f0f0];
const objs = cols.map((c, i) => {
  const ball = i % 3 === 2, m = new THREE.Mesh(ball ? sphG : boxG, M(c, c, 0.15));
  if (!ball) m.add(new THREE.LineSegments(edgeG, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })));
  m.ball = ball; m.rest = ball ? 0.6 : 0.3; m.v = new THREE.Vector3(); m.held = null; scene.add(m); return m;
});
function resetObjs() {
  objs.forEach((c, i) => {
    if (c.held) { c.held.grab = null; c.held = null; }
    c.position.set(TB.x - 0.3 + (i % 5) * 0.15, TB.y + R + 0.005, TB.z + (i < 5 ? -0.1 : 0.1)); c.v.set(0, 0, 0); c.rotation.set(0, 0, 0);
  });
}
resetObjs();

function physics(dt) {
  for (const c of objs) {
    if (c.held) continue;
    const pb = c.position.y - R;
    c.v.y -= 9.8 * dt; c.position.addScaledVector(c.v, dt);
    const onT = Math.abs(c.position.x - TB.x) < TB.w / 2 + R * 0.3 && Math.abs(c.position.z - TB.z) < TB.d / 2 + R * 0.3;
    const g = onT && pb >= TB.y - 0.1 ? TB.y : 0;
    if (c.position.y - R < g) {
      c.position.y = g + R; c.v.y = Math.abs(c.v.y) > 0.5 ? -c.v.y * c.rest : 0;
      const f = Math.exp(-(c.ball ? 0.8 : 5) * dt); c.v.x *= f; c.v.z *= f;
    }
    c.position.x = THREE.MathUtils.clamp(c.position.x, -6, 6); c.position.z = THREE.MathUtils.clamp(c.position.z, -6, 6);
  }
  for (let i = 0; i < objs.length; i++) for (let j = i + 1; j < objs.length; j++) {
    const a = objs[i], b = objs[j], wa = a.held ? 0 : 1, wb = b.held ? 0 : 1, tot = wa + wb;
    if (!tot) continue;
    T1.subVectors(b.position, a.position); const d = T1.length();
    if (d >= S || d < 1e-5) continue;
    T1.divideScalar(d); const pen = S - d;
    a.position.addScaledVector(T1, -pen * wa / tot); b.position.addScaledVector(T1, pen * wb / tot);
    const rel = T2.subVectors(b.v, a.v).dot(T1);
    if (rel < 0) { const imp = -rel * 1.25 / tot; a.v.addScaledVector(T1, -imp * wa); b.v.addScaledVector(T1, imp * wb); }
  }
}

/* ---------- skinned virtual hands ---------- */
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const PE = new Set(['0-5', '5-9', '9-13', '13-17', '0-17']);
const BR = BONES.map(([s, e]) => PE.has(s + '-' + e) ? 0.0095 : s < 4 ? 0.0085 : 0.007);
const JR = i => [4, 8, 12, 16, 20].includes(i) ? 0.0075 : [0, 5, 9, 13, 17].includes(i) ? 0.0098 : 0.0078;
const PALM = [0, 1, 5, 9, 13, 17];
const jointG = new THREE.SphereGeometry(1, 10, 8), boneG = new THREE.CylinderGeometry(1, 1, 1, 8, 1, true);
const skin = M(0xd7a58c, 0x3a1c10, 0.25), skin2 = skin.clone(); skin2.side = THREE.DoubleSide;
function makeHand() {
  const g = new THREE.Group(); g.visible = false;
  g.joints = Array.from({ length: 21 }, (_, i) => { const s = new THREE.Mesh(jointG, skin); s.scale.setScalar(JR(i)); g.add(s); return s; });
  g.bones = new THREE.InstancedMesh(boneG, skin, BONES.length); g.bones.frustumCulled = false; g.add(g.bones);
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(18), 3)); pg.setIndex([0, 1, 2, 0, 2, 3, 0, 3, 4, 0, 4, 5]);
  g.palm = new THREE.Mesh(pg, skin2); g.palm.frustumCulled = false; g.add(g.palm);
  g.cursor = new THREE.Mesh(new THREE.SphereGeometry(0.01, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })); g.add(g.cursor);
  const v = () => Array.from({ length: 21 }, () => new THREE.Vector3());
  g.pts = v(); g.tg = v(); g.pp = v();
  g.pw = new THREE.Vector3(); g.pm = new THREE.Vector3(); g.vel = new THREE.Vector3();
  g.pinch = false; g.grab = null; g.has = false; g.snap = true; g.d = 0.4; camera.add(g); return g;
}
const hands = [makeHand(), makeHand()];
const REAL_PALM = 0.09, FOV_LONG = 1 / (2 * Math.tan(THREE.MathUtils.degToRad(32.5)));
const CT = [[4, .011], [8, .011], [12, .012], [16, .012], [20, .011], [9, .035], [0, .03], [5, .02], [13, .02], [17, .02]];

function release(h) { if (h.grab) { h.grab.held = null; h.grab.v.copy(h.vel).clampLength(0, 4.5); h.grab = null; } }
function tryGrab(h) {
  let best = null, bd = 0.16;
  for (const c of objs) { if (c.held) continue; const d = c.position.distanceTo(h.pw); if (d < bd) { bd = d; best = c; } }
  if (best) { best.held = h; h.grab = best; navigator.vibrate && navigator.vibrate(12); }
}

function onHands(res) {
  const reach = parseFloat($('#rc').value), vw = video.videoWidth, vh = video.videoHeight, f = Math.max(vw, vh) * FOV_LONG;
  hands.forEach((h, i) => {
    const lm = res.landmarks[i];
    if (!lm) { release(h); h.pinch = false; h.visible = false; h.has = false; h.snap = true; return; }
    const palm = Math.hypot((lm[0].x - lm[9].x) * vw, (lm[0].y - lm[9].y) * vh);
    const d = THREE.MathUtils.clamp(REAL_PALM * f / Math.max(palm, 1), 0.15, 1.0);
    h.d += (d - h.d) * (h.has ? 0.35 : 1);
    const k = h.d / f, p0x = (lm[0].x * vw - vw / 2) * k, p0y = -(lm[0].y * vh - vh / 2) * k, p0z = -h.d;
    lm.forEach((p, j) => {
      const x = (p.x * vw - vw / 2) * k, y = -(p.y * vh - vh / 2) * k, z = -h.d - p.z * vw * k;
      h.tg[j].set(p0x * reach + (x - p0x), p0y * reach + (y - p0y), p0z * reach + (z - p0z));
    });
    const r = h.tg[4].distanceTo(h.tg[8]) / Math.max(h.tg[0].distanceTo(h.tg[9]), 1e-4);
    if (!h.pinch && r < 0.32) { h.pinch = true; camera.localToWorld(h.pw.copy(h.tg[4]).add(h.tg[8]).multiplyScalar(0.5)); tryGrab(h); }
    else if (h.pinch && r > 0.55) { h.pinch = false; release(h); }
    h.cursor.material.color.set(h.pinch ? 0xff6b8b : 0xffffff);
    if (!h.has) h.snap = true;
    h.has = true; h.visible = true;
  });
}

// runs every frame: smooths detections to display rate, builds the mesh, resolves contacts
function handsWorld(dt) {
  const kk = 1 - Math.exp(-26 * dt);
  for (const h of hands) {
    if (!h.has) continue;
    for (let j = 0; j < 21; j++) { h.pp[j].copy(h.pts[j]); h.pts[j].lerp(h.tg[j], h.snap ? 1 : kk); h.joints[j].position.copy(h.pts[j]); }
    if (h.snap) for (let j = 0; j < 21; j++) h.pp[j].copy(h.pts[j]);
    h.snap = false;
    BONES.forEach(([s, e], n) => {
      const a = h.pts[s], b = h.pts[e]; T1.subVectors(b, a); const len = T1.length() || 1e-4;
      QQ.setFromUnitVectors(Y, T1.divideScalar(len)); T2.addVectors(a, b).multiplyScalar(0.5); T3.set(BR[n], len, BR[n]);
      h.bones.setMatrixAt(n, MM.compose(T2, QQ, T3));
    });
    h.bones.instanceMatrix.needsUpdate = true;
    const pa = h.palm.geometry.attributes.position; PALM.forEach((j, n) => h.pts[j].toArray(pa.array, n * 3)); pa.needsUpdate = true; h.palm.geometry.computeVertexNormals();
    h.cursor.position.copy(h.pts[4]).add(h.pts[8]).multiplyScalar(0.5);
    camera.localToWorld(h.pw.copy(h.cursor.position));
    T1.copy(h.cursor.position).sub(h.pm).divideScalar(dt).applyQuaternion(camera.quaternion); h.vel.lerp(T1, 0.3); h.pm.copy(h.cursor.position);
    if (h.grab) {
      const o = h.grab; o.position.lerp(h.pw, 0.5);
      T1.subVectors(h.pts[9], h.pts[0]).applyQuaternion(camera.quaternion);   // wrist twist -> yaw of the held object
      const dy = ((Math.atan2(T1.x, T1.z) - o.rotation.y + 3 * Math.PI) % (2 * Math.PI)) - Math.PI; o.rotation.y += dy * 0.2;
    }
    // fingertips and palm push free objects
    for (const [i, cr] of CT) {
      if (h.pinch && (i === 4 || i === 8)) continue;
      camera.localToWorld(T1.copy(h.pts[i]));
      T2.subVectors(h.pts[i], h.pp[i]).divideScalar(dt).applyQuaternion(camera.quaternion).clampLength(0, 6);
      for (const o of objs) {
        if (o.held) continue;
        T3.subVectors(o.position, T1); const d = T3.length(), m = R + cr;
        if (d < m && d > 1e-5) {
          T3.divideScalar(d); o.position.addScaledVector(T3, m - d);
          const rel = T2.dot(T3) - o.v.dot(T3); if (rel > 0) o.v.addScaledVector(T3, rel * 1.15);
        }
      }
    }
  }
  for (const o of objs) {
    let near = false; for (const h of hands) if (h.has && o.position.distanceTo(h.pw) < 0.16) near = true;
    o.material.emissiveIntensity = o.held ? 0.9 : near ? 0.5 : 0.15;
  }
}

/* ---------- head orientation ---------- */
const eul = new THREE.Euler(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), devQ = new THREE.Quaternion(), yawQ = new THREE.Quaternion();
let gyro = null, yawOff = 0, needCenter = true, lookYaw = 0, lookPitch = 0;
addEventListener('deviceorientation', e => { if (e.alpha != null) gyro = e; });
function updateCam() {
  if (gyro) {
    const o = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
    eul.set(THREE.MathUtils.degToRad(gyro.beta), THREE.MathUtils.degToRad(gyro.alpha), -THREE.MathUtils.degToRad(gyro.gamma), 'YXZ');
    devQ.setFromEuler(eul).multiply(q1).multiply(q0.setFromAxisAngle(Z, -o));
    if (needCenter) { yawOff = eul.setFromQuaternion(devQ, 'YXZ').y; needCenter = false; }
    camera.quaternion.copy(yawQ.setFromAxisAngle(Y, -yawOff)).multiply(devQ);
  } else camera.quaternion.setFromEuler(eul.set(lookPitch, lookYaw, 0, 'YXZ'));
}
let drag = null; const cv = $('#gl');
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, m: 0 }; });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.m += Math.abs(dx) + Math.abs(dy);
  if (!gyro) { lookYaw -= dx * 0.005; lookPitch = THREE.MathUtils.clamp(lookPitch - dy * 0.005, -1.4, 1.4); }
});
cv.addEventListener('pointerup', () => { if (drag && drag.m < 8 && vr) needCenter = true; drag = null; });

let vr = false;
function setVR(v) {
  vr = v; document.body.classList.toggle('vr', v); $('#bvr').classList.toggle('on', v);
  try {
    if (v) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().then(() => screen.orientation.lock('landscape')).catch(() => {});
    else document.fullscreenElement && document.exitFullscreen();
  } catch (e) {}
}
$('#bvr').onclick = () => setVR(!vr); $('#x').onclick = () => setVR(false);
$('#brc').onclick = () => { needCenter = true; lookYaw = 0; lookPitch = 0; }; $('#brs').onclick = resetObjs;

/* ---------- camera + MediaPipe ---------- */
let HL = null;
async function initCam() {
  video.srcObject = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } } });
  await video.play(); $('#p1').classList.add('on'); $('#p2').classList.add('on');
}
async function initHL() {
  st('กำลังโหลดโมเดลจับมือ...');
  const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { HandLandmarker, FilesetResolver } = await import(V + '/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks(V + '/wasm');
  const opt = d => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d }, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
  try { HL = await HandLandmarker.createFromOptions(fs, opt('GPU')); } catch (e) { HL = await HandLandmarker.createFromOptions(fs, opt('CPU')); }
  st('พร้อมแล้ว ยื่นมือให้กล้องหลังเห็น');
}
const c1 = $('#p1').getContext('2d'), c2 = $('#p2').getContext('2d');
function drawPv(r) {
  c1.drawImage(video, 0, 0, 96, 72); c1.fillStyle = '#4fd8ff';
  r.landmarks.forEach(l => l.forEach(p => c1.fillRect(p.x * 96 - 1, p.y * 72 - 1, 2, 2)));
  if (vr) c2.drawImage($('#p1'), 0, 0);
}

/* ---------- loop: detection is throttled so it never starves rendering ---------- */
function render() {
  const w = innerWidth, h = innerHeight;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h); renderer.clear();
  if (!vr) { renderer.render(scene, camera); return; }
  sc.update(camera); renderer.setScissorTest(true);
  renderer.setViewport(0, 0, w / 2, h); renderer.setScissor(0, 0, w / 2, h); renderer.render(scene, sc.cameraL);
  renderer.setViewport(w / 2, 0, w / 2, h); renderer.setScissor(w / 2, 0, w / 2, h); renderer.render(scene, sc.cameraR);
}
let last = performance.now(), lastVT = -1, nextDet = 0, detMs = 20, lastSt = 0, fps = 60, pvn = 0;
function loop() {
  requestAnimationFrame(loop);
  const now = performance.now(), dt = Math.min(Math.max((now - last) / 1000, 0.004), 0.05); last = now;
  fps += (1 / dt - fps) * 0.1;
  updateCam(); camera.updateMatrixWorld(true);
  if (HL && video.readyState >= 2 && now >= nextDet && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    const r = HL.detectForVideo(video, now), t1 = performance.now();
    detMs = detMs * 0.7 + (t1 - now) * 0.3; nextDet = t1 + Math.max(33, detMs * 1.8);
    onHands(r); if (++pvn % 3 === 0) drawPv(r);
  }
  handsWorld(dt); physics(dt); render();
  if (now - lastSt > 500 && HL) {
    lastSt = now;
    st('มือ ' + hands.filter(h => h.has).length + ' · ' + (hands.some(h => h.pinch) ? 'จีบ' : 'ปล่อย') + ' · ' + Math.round(fps) + ' fps · ตรวจจับ ' + Math.round(detMs) + ' ms' + (gyro ? '' : ' · ลากนิ้วเพื่อหมุนมุมมอง'));
  }
}

$('#go').onclick = async () => {
  $('#go').disabled = true;
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  $('#ov').style.display = 'none'; requestAnimationFrame(loop); st('กำลังเปิดกล้อง...');
  initCam().then(initHL).catch(e => st('ใช้จับมือไม่ได้: ' + (e && e.message ? e.message : e)));
};
</script>
