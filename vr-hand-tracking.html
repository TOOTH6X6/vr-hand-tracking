<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>VR + Hand Tracking บนมือถือ</title>
<style>
:root{--bg:#0a0e1b;--fg:#e9eeff;--ac:#4fd8ff;--hot:#ff6b8b;--pn:rgba(10,14,27,.82)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;font-family:"Noto Sans Thai",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) 8px max(8px,env(safe-area-inset-left))}
button{font:inherit;font-size:14px;color:var(--fg);background:var(--pn);border:1px solid #33406b;border-radius:10px;padding:9px 12px}
button:active{background:#1c2748}
button.on{border-color:var(--ac);color:var(--ac)}
#rcw{display:flex;align-items:center;gap:6px;background:var(--pn);border:1px solid #33406b;border-radius:10px;padding:6px 10px;font-size:13px}
#rc{width:90px}
#st{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:5;font-size:13px;max-width:60%;background:var(--pn);padding:6px 10px;border-radius:8px}
.pv{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));right:max(8px,env(safe-area-inset-right));width:120px;height:90px;border:1px solid var(--ac);border-radius:8px;background:#000;z-index:4;display:none}
.pv.on{display:block}
#p2{display:none}
#x{position:fixed;top:max(6px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:6;display:none;padding:4px 10px;font-size:12px}
body.vr #ui,body.vr #st{display:none}
body.vr #x{display:block}
body.vr #p1{left:calc(25% - 60px);right:auto}
body.vr #p2.on{display:block;left:calc(75% - 60px)}
#ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px;text-align:center;background:rgba(10,14,27,.96)}
#ov h1{margin:0;font-size:26px;font-weight:700;line-height:1.3}
#ov p{margin:0;max-width:34em;line-height:1.7;color:#aab6dd;font-size:15px}
#go{background:var(--ac);color:#04121a;font-weight:700;font-size:17px;border:0;padding:13px 34px}
#v{position:fixed;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="v" playsinline muted></video>
<canvas id="p1" class="pv" width="120" height="90"></canvas>
<canvas id="p2" class="pv" width="120" height="90"></canvas>

<div id="ui">
  <button id="bvr">โหมด VR (แยกจอ)</button>
  <button id="brc">รีเซ็ตมุมมอง</button>
  <button id="brs">รีเซ็ตลูกบาศก์</button>
  <label id="rcw">ระยะเอื้อม <input id="rc" type="range" min="1" max="2.6" step=".1" value="1.7"></label>
</div>
<button id="x">ออกจาก VR</button>
<div id="st">พร้อมเริ่ม</div>

<div id="ov">
  <h1>VR + Hand Tracking บนมือถือ</h1>
  <p>ใส่มือถือในแว่น Cardboard โดยให้กล้องหลังหันไปข้างหน้า ยื่นมือให้กล้องเห็น แล้วจีบนิ้วโป้งกับนิ้วชี้เพื่อหยิบลูกบาศก์บนโต๊ะ เหวี่ยงมือแล้วปล่อยเพื่อโยน</p>
  <p>ต้องเปิดผ่าน HTTPS และอนุญาตกล้อง กับเซนเซอร์การเคลื่อนไหว</p>
  <button id="go">เริ่ม</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const $ = s => document.querySelector(s);
const video = $('#v');
const st = t => { $('#st').textContent = t; };

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e1b);
scene.fog = new THREE.Fog(0x0a0e1b, 5, 16);
const camera = new THREE.PerspectiveCamera(70, 1, 0.02, 60);
camera.position.set(0, 1.45, 0.1);
scene.add(camera);
const sc = new THREE.StereoCamera();
sc.eyeSep = 0.064; sc.aspect = 0.5;

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0xa9c0ff, 0x1a1024, 0.95));
const dl = new THREE.DirectionalLight(0xffffff, 0.8); dl.position.set(2, 4, 2); scene.add(dl);
const pl = new THREE.PointLight(0x4fd8ff, 1.3, 6); pl.position.set(0, 2.2, -0.5); scene.add(pl);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x111a30, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
const grid = new THREE.GridHelper(40, 80, 0x4fd8ff, 0x1d2a50); grid.position.y = 0.002; scene.add(grid);

// pillars around the room (depth cues)
for (let i = 0; i < 14; i++) {
  const a = (i / 14) * Math.PI * 2, r = 4 + (i % 3) * 0.8, h = 1.5 + (i * 37 % 10) / 3;
  const col = new THREE.Color().setHSL((i * 0.11) % 1, 0.7, 0.55);
  const p = new THREE.Mesh(new THREE.BoxGeometry(0.35, h, 0.35), new THREE.MeshStandardMaterial({ color: 0x1b2442, emissive: col, emissiveIntensity: 0.45 }));
  p.position.set(Math.cos(a) * r, h / 2, Math.sin(a) * r); scene.add(p);
}

// table
const TB = { x: 0, z: -0.5, w: 0.9, d: 0.5, y: 1.0 };
const tmat = new THREE.MeshStandardMaterial({ color: 0x2b3860, roughness: 0.6 });
const top = new THREE.Mesh(new THREE.BoxGeometry(TB.w, 0.04, TB.d), tmat);
top.position.set(TB.x, TB.y - 0.02, TB.z); scene.add(top);
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([a, b]) => {
  const l = new THREE.Mesh(new THREE.BoxGeometry(0.04, TB.y, 0.04), tmat);
  l.position.set(TB.x + a * (TB.w / 2 - 0.04), TB.y / 2, TB.z + b * (TB.d / 2 - 0.04)); scene.add(l);
});

// cubes
const S = 0.09, cubeGeo = new THREE.BoxGeometry(S, S, S), edgeGeo = new THREE.EdgesGeometry(cubeGeo);
const cols = [0xff5470, 0xffb347, 0xffe14d, 0x5ef08a, 0x4fd8ff, 0xb98cff];
const cubes = cols.map(c => {
  const m = new THREE.Mesh(cubeGeo, new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.15, roughness: 0.5 }));
  m.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })));
  m.v = new THREE.Vector3(); m.held = null; m.prevY = 0; scene.add(m); return m;
});
function resetCubes() {
  cubes.forEach((c, i) => {
    c.position.set(TB.x - 0.33 + i * 0.132, TB.y + S / 2 + 0.01, TB.z + (i % 2 ? 0.08 : -0.08));
    c.v.set(0, 0, 0); if (c.held) { c.held.grab = null; c.held = null; }
  });
}
resetCubes();

function physics(dt) {
  for (const c of cubes) {
    if (c.held) continue;
    const h = S / 2, pb = c.position.y - h;
    c.v.y -= 9.8 * dt;
    c.position.addScaledVector(c.v, dt);
    const onT = Math.abs(c.position.x - TB.x) < TB.w / 2 + h * 0.3 && Math.abs(c.position.z - TB.z) < TB.d / 2 + h * 0.3;
    const ground = onT && pb >= TB.y - 0.1 ? TB.y : 0;
    if (c.position.y - h < ground) {
      c.position.y = ground + h;
      c.v.y = Math.abs(c.v.y) > 0.5 ? -c.v.y * 0.35 : 0;
      const f = Math.exp(-5 * dt); c.v.x *= f; c.v.z *= f;
    }
    c.position.x = THREE.MathUtils.clamp(c.position.x, -6, 6);
    c.position.z = THREE.MathUtils.clamp(c.position.z, -6, 6);
  }
}

/* ---------- virtual hands (children of camera) ---------- */
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function makeHand(color) {
  const g = new THREE.Group(); g.visible = false;
  const jm = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 });
  g.joints = Array.from({ length: 21 }, (_, i) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry([4, 8, 12, 16, 20].includes(i) ? 0.009 : 0.0065, 10, 8), jm);
    g.add(m); return m;
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(BONES.length * 6), 3));
  g.lines = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color })); g.lines.frustumCulled = false; g.add(g.lines);
  g.cursor = new THREE.Mesh(new THREE.SphereGeometry(0.013, 12, 10), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
  g.add(g.cursor);
  g.pts = Array.from({ length: 21 }, () => new THREE.Vector3());
  g.pw = new THREE.Vector3(); g.prevPw = new THREE.Vector3(); g.vel = new THREE.Vector3();
  g.pinch = false; g.grab = null; g.has = false; g.d = 0.4;
  camera.add(g); return g;
}
const hands = [makeHand(0x4fd8ff), makeHand(0xff6b8b)];

const REAL_PALM = 0.09;               // wrist -> middle knuckle, metres
const FOV_LONG = 1 / (2 * Math.tan(THREE.MathUtils.degToRad(32.5))); // long side ~65 deg
const tmp = new THREE.Vector3(), mid = new THREE.Vector3();

function release(h) {
  if (h.grab) { h.grab.held = null; h.grab.v.copy(h.vel).clampLength(0, 4); h.grab = null; }
}
function tryGrab(h) {
  let best = null, bd = 0.14;
  for (const c of cubes) { if (c.held) continue; const d = c.position.distanceTo(h.pw); if (d < bd) { bd = d; best = c; } }
  if (best) { best.held = h; h.grab = best; }
}

function onHands(res) {
  const reach = parseFloat($('#rc').value);
  const vw = video.videoWidth, vh = video.videoHeight, f = Math.max(vw, vh) * FOV_LONG;
  hands.forEach((h, i) => {
    const lm = res.landmarks[i];
    if (!lm) { release(h); h.pinch = false; h.visible = false; h.has = false; return; }
    const palm = Math.hypot((lm[0].x - lm[9].x) * vw, (lm[0].y - lm[9].y) * vh);
    const d = THREE.MathUtils.clamp(REAL_PALM * f / Math.max(palm, 1), 0.15, 1.0);
    h.d += (d - h.d) * (h.has ? 0.3 : 1);
    const k = h.d / f, a = h.has ? 0.55 : 1;
    const p0x = (lm[0].x * vw - vw / 2) * k, p0y = -(lm[0].y * vh - vh / 2) * k, p0z = -h.d;
    lm.forEach((p, j) => {
      const x = (p.x * vw - vw / 2) * k, y = -(p.y * vh - vh / 2) * k, z = -h.d - p.z * vw * k;
      // amplify wrist translation so a short arm can reach the table; keep finger size natural
      tmp.set(p0x * reach + (x - p0x), p0y * reach + (y - p0y), p0z * reach + (z - p0z));
      h.pts[j].lerp(tmp, a);
      h.joints[j].position.copy(h.pts[j]);
    });
    const arr = h.lines.geometry.attributes.position.array;
    BONES.forEach(([s, e], n) => { h.pts[s].toArray(arr, n * 6); h.pts[e].toArray(arr, n * 6 + 3); });
    h.lines.geometry.attributes.position.needsUpdate = true;
    mid.copy(h.pts[4]).add(h.pts[8]).multiplyScalar(0.5);
    h.cursor.position.copy(mid);
    const r = h.pts[4].distanceTo(h.pts[8]) / Math.max(h.pts[0].distanceTo(h.pts[9]), 1e-4);
    if (!h.pinch && r < 0.32) { h.pinch = true; camera.localToWorld(h.pw.copy(mid)); tryGrab(h); }
    else if (h.pinch && r > 0.55) { h.pinch = false; release(h); }
    h.cursor.material.color.set(h.pinch ? 0xff6b8b : 0xffffff);
    h.has = true; h.visible = true;
  });
}

function handsWorld(dt) {
  for (const h of hands) {
    if (!h.has) continue;
    h.prevPw.copy(h.pw);
    camera.localToWorld(h.pw.copy(h.cursor.position));
    if (dt > 0) h.vel.lerp(tmp.copy(h.pw).sub(h.prevPw).divideScalar(dt), 0.3);
    if (h.grab) h.grab.position.lerp(h.pw, 0.45);
  }
  for (const c of cubes) {
    let near = false;
    for (const h of hands) if (h.has && c.position.distanceTo(h.pw) < 0.14) near = true;
    c.material.emissiveIntensity = c.held ? 0.9 : near ? 0.5 : 0.15;
  }
}

/* ---------- head orientation (gyro, drag fallback) ---------- */
const Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
const eul = new THREE.Euler(), q0 = new THREE.Quaternion(), q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const devQ = new THREE.Quaternion(), yawQ = new THREE.Quaternion();
let gyro = null, yawOff = 0, needCenter = true, lookYaw = 0, lookPitch = 0;
addEventListener('deviceorientation', e => { if (e.alpha != null) gyro = e; });
function updateCam() {
  if (gyro) {
    const o = THREE.MathUtils.degToRad((screen.orientation && screen.orientation.angle) || window.orientation || 0);
    eul.set(THREE.MathUtils.degToRad(gyro.beta), THREE.MathUtils.degToRad(gyro.alpha), -THREE.MathUtils.degToRad(gyro.gamma), 'YXZ');
    devQ.setFromEuler(eul).multiply(q1).multiply(q0.setFromAxisAngle(Z, -o));
    if (needCenter) { yawOff = eul.setFromQuaternion(devQ, 'YXZ').y; needCenter = false; }
    camera.quaternion.copy(yawQ.setFromAxisAngle(Y, -yawOff)).multiply(devQ);
  } else {
    camera.quaternion.setFromEuler(eul.set(lookPitch, lookYaw, 0, 'YXZ'));
  }
}
let drag = null;
const cv = $('#gl');
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, m: 0 }; });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY; drag.m += Math.abs(dx) + Math.abs(dy);
  if (!gyro) { lookYaw -= dx * 0.005; lookPitch = THREE.MathUtils.clamp(lookPitch - dy * 0.005, -1.4, 1.4); }
});
cv.addEventListener('pointerup', () => { if (drag && drag.m < 8 && vr) needCenter = true; drag = null; });

/* ---------- VR toggle ---------- */
let vr = false;
function setVR(v) {
  vr = v; document.body.classList.toggle('vr', v); $('#bvr').classList.toggle('on', v);
  if (v) {
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().then(() => screen.orientation.lock('landscape')).catch(() => {}); } catch (e) {}
  } else { try { document.fullscreenElement && document.exitFullscreen(); } catch (e) {} }
}
$('#bvr').onclick = () => setVR(!vr);
$('#x').onclick = () => setVR(false);
$('#brc').onclick = () => { needCenter = true; lookYaw = 0; lookPitch = 0; };
$('#brs').onclick = resetCubes;

/* ---------- camera + MediaPipe ---------- */
let HL = null;
async function initCam() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 480 } } });
  video.srcObject = stream; await video.play();
  $('#p1').classList.add('on'); $('#p2').classList.add('on');
}
async function initHL() {
  st('กำลังโหลดโมเดลจับมือ...');
  const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { HandLandmarker, FilesetResolver } = await import(V + '/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks(V + '/wasm');
  const opt = d => ({
    baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d },
    runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5
  });
  try { HL = await HandLandmarker.createFromOptions(fs, opt('GPU')); }
  catch (e) { HL = await HandLandmarker.createFromOptions(fs, opt('CPU')); }
  st('พร้อมแล้ว ยื่นมือให้กล้องหลังเห็น');
}
const pcs = [$('#p1'), $('#p2')].map(c => c.getContext('2d'));
function drawPv(r) {
  for (const c of pcs) {
    c.drawImage(video, 0, 0, 120, 90);
    c.fillStyle = '#4fd8ff';
    r.landmarks.forEach(l => l.forEach(p => c.fillRect(p.x * 120 - 1, p.y * 90 - 1, 3, 3)));
  }
}

/* ---------- main loop ---------- */
let last = performance.now(), lastVT = -1, lastSt = 0, fps = 0;
function render() {
  const w = innerWidth, h = innerHeight;
  renderer.setScissorTest(false); renderer.setViewport(0, 0, w, h); renderer.clear();
  if (!vr) { renderer.render(scene, camera); return; }
  sc.update(camera);
  renderer.setScissorTest(true);
  renderer.setViewport(0, 0, w / 2, h); renderer.setScissor(0, 0, w / 2, h); renderer.render(scene, sc.cameraL);
  renderer.setViewport(w / 2, 0, w / 2, h); renderer.setScissor(w / 2, 0, w / 2, h); renderer.render(scene, sc.cameraR);
}
function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min((t - last) / 1000, 0.05); last = t;
  fps += (1 / Math.max(dt, 0.001) - fps) * 0.1;
  updateCam(); camera.updateMatrixWorld(true);
  if (HL && video.readyState >= 2 && video.currentTime !== lastVT) {
    lastVT = video.currentTime;
    const r = HL.detectForVideo(video, performance.now());
    onHands(r); drawPv(r);
  }
  handsWorld(dt); physics(dt); render();
  if (t - lastSt > 400 && HL) {
    lastSt = t;
    const n = hands.filter(h => h.has).length;
    st('มือ ' + n + ' · ' + (hands.some(h => h.pinch) ? 'จีบอยู่' : 'ปล่อย') + ' · ' + Math.round(fps) + ' fps' + (gyro ? '' : ' · ลากนิ้วเพื่อหมุนมุมมอง'));
  }
}

$('#go').onclick = async () => {
  $('#go').disabled = true;
  try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  $('#ov').style.display = 'none';
  requestAnimationFrame(loop);
  st('กำลังเปิดกล้อง...');
  initCam().then(initHL).catch(e => st('ใช้จับมือไม่ได้: ' + (e && e.message ? e.message : e)));
};
</script>
</body>
</html>
